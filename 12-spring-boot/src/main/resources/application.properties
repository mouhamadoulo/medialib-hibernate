# Configuration volontairement minimale : chaque test du chapitre fixe lui-meme les
# proprietes qui l'interessent, pour que le comportement demontre soit lisible dans le test.
#
# A noter : spring.jpa.open-in-view vaut true par DEFAUT dans Spring Boot. Ce defaut est le
# sujet de OsivTest, et Boot emet d'ailleurs un avertissement au demarrage pour le signaler.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.show_sql=false
logging.level.org.hibernate=WARN
logging.level.org.testcontainers=WARN
